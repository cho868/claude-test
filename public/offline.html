<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オフライン | 身内ポータル</title>
<style>
    body { margin: 0; display: grid; place-items: center; min-height: 100vh;
           background: #f1f5f9; color: #334155;
           font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; }
    .card { max-width: 22rem; padding: 2rem; text-align: center; background: #fff;
            border-radius: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
    p { margin: 0 0 1.25rem; font-size: .875rem; color: #64748b; line-height: 1.7; }
    button { padding: .6rem 1.2rem; font-size: .875rem; font-weight: 600; color: #fff;
             background: #0f172a; border: 0; border-radius: .5rem; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
    <h1>📡 つながりません</h1>
    <p>
        ネットワークに接続できませんでした。<br>
        自宅サーバーが再起動中の可能性もあります。
    </p>
    <button onclick="location.reload()">再読み込み</button>
</div>
</body>
</html>
